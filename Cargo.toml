[package]
name = "spotify-tidal-migrator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.6.2", features = ["derive"] }
dotenvy = "0.15.7"
futures-util = "0.3.32"
httpdate = "1.0.3"
inquire = "0.9.4"
open = "5.4.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json", "rustls", "form", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
strsim = "0.11.1"
tokio = { version = "1.52.4", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.25"
url = "2.5.8"
